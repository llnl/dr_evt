name: Build CI Image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        if: github.repository == 'llnl/dr_evt' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'llnl/dr_evt')
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        if: github.repository == 'llnl/dr_evt' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'llnl/dr_evt')
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.repository == 'llnl/dr_evt' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'llnl/dr_evt')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        if: github.repository == 'llnl/dr_evt' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'llnl/dr_evt')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          push: ${{ github.repository == 'llnl/dr_evt' }}
          tags: ghcr.io/llnl/dr_evt-ci:ci-image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/llnl/dr_evt
