name: Quick Test (Scheduler + Serialization + Trace Schema)

# Fast CI for quick validation (runs on non-main branch pushes and manually)
# Runs scheduler correctness, Ser20 memory serialization, and the lightweight
# C++ trace-schema API suite.
# Full test suite runs on pull requests and pushes to main or develop.

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  build-image:
    name: Prepare CI Image
    uses: ./.github/workflows/build-ci-image.yml
    permissions:
      contents: read
      packages: write

  quick-test:
    needs: build-image
    name: Quick Scheduler, Serialization, and Trace Schema Check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/llnl/dr_evt-ci:ci-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    env:
      CMAKE_INSTALL_PREFIX: ${{ github.workspace }}/install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure and Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DDR_EVT_WITH_SER20=ON
          make -j$(nproc)
          make install

      - name: Run Scheduler Correctness Tests Only
        id: scheduler-correctness
        run: |
          echo "Running scheduler-correctness tests with installed binary..."
          ./tests/run_scheduler_correctness_tests.sh

      - name: Run Node Release Delay Tests
        id: node-release-delay
        run: |
          # The same 34 workloads with a constant node release delay, compared
          # against the Python reference, plus zero-delay identity, replay
          # exclusion, and rejected values.
          ./tests/run_node_release_delay_tests.sh

      - name: Run Periodic Backfill Tests
        id: periodic-backfill
        run: |
          # The same 34 workloads under hybrid and conservative periodic
          # backfill at two tick intervals, compared against the Python
          # conservative reference, plus zero-interval identity and rejected
          # values.
          ./tests/run_periodic_backfill_tests.sh

      - name: Run Planning Horizon Tests
        id: planning-horizon
        run: |
          # Event-driven planning horizon for easy, hybrid, conservative, and
          # sjf against the Python references, unlimited-horizon identity on
          # the 34 workloads, and rejected values.
          ./tests/run_planning_horizon_tests.sh

      - name: Run Trace Schema Unit Tests
        id: trace-schema
        run: |
          # Covers optional queue input and preservation of the input schema
          # in generated output, alongside the rest of the C++ progressive
          # loading API tests.
          $GITHUB_WORKSPACE/install/bin/tests/test_progressive_load
          $GITHUB_WORKSPACE/install/bin/tests/test_queue_input

      - name: Run Streaming Append API Tests
        id: append-job
        run: $GITHUB_WORKSPACE/install/bin/tests/test_append_job_api

      - name: Validate Capped Monthly Experiment Scripts
        id: capped-monthly-scripts
        run: python3 tests/test_monthly_backfill_cap_scripts.py

      - name: Run Ser20 Memory Serialization Test
        id: serialization
        run: $GITHUB_WORKSPACE/install/bin/tests/t_state_ser20

      - name: Summary
        if: always()
        run: |
          echo "========================================"
          echo "Quick Test Complete"
          echo "Scheduler correctness (34 fixtures): ${{ steps.scheduler-correctness.outcome }}"
          echo "Node release delay (34 differential + 3 checks): ${{ steps.node-release-delay.outcome }}"
          echo "Periodic backfill: ${{ steps.periodic-backfill.outcome }}"
          echo "Planning horizon: ${{ steps.planning-horizon.outcome }}"
          echo "Streaming append API (23 checks): ${{ steps.append-job.outcome }}"
          echo "Ser20 memory serialization: ${{ steps.serialization.outcome }}"
          echo "Trace schema / progressive-loading API: ${{ steps.trace-schema.outcome }}"
          echo "Capped monthly experiment scripts: ${{ steps.capped-monthly-scripts.outcome }}"
          echo "========================================"
