name: DR_EVT Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-11
            cxx: g++-11
          - compiler: clang
            cc: clang-14
            cxx: clang++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libboost-all-dev \
            python3 \
            python3-pip \
            libopenmpi-dev \
            openmpi-bin \
            libprotobuf-dev \
            protobuf-compiler \
            libgrpc++-dev \
            protobuf-compiler-grpc \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Display versions
        run: |
          echo "=== Compiler versions ==="
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          cmake --version
          python3 --version
          echo "=== MPI version ==="
          mpirun --version
          echo "=== Boost version ==="
          dpkg -l | grep libboost-dev

      - name: Create Python virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          source venv/bin/activate
          # Explicitly pin Python3_EXECUTABLE to the active venv's
          # interpreter. find_package(Python3) in SetupPybind11.cmake
          # does not reliably pick up an activated venv on its own across
          # CMake versions/environments - without this, it can silently
          # resolve to a different system Python (e.g. Ubuntu 24.04's
          # default 3.12) even with the venv active, producing a
          # dr_evt.cpython-312-*.so that the venv's own 3.9 interpreter
          # can never import (compiled extension modules are ABI-specific
          # to their build interpreter's version).
          PYTHON_EXE=$(command -v python3)
          echo "Building Python bindings against: $PYTHON_EXE ($($PYTHON_EXE --version))"
          # Fresh build directory: avoids picking up a stale .so left over
          # from an earlier configure against a different Python version.
          rm -rf build install
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DDR_EVT_BUILD_PYTHON=ON \
            -DDR_EVT_ENABLE_PROTOBUF=ON \
            -DDR_EVT_ENABLE_GRPC=ON \
            -DPython3_EXECUTABLE=$PYTHON_EXE

      - name: Build
        run: |
          source venv/bin/activate
          cd build
          make -j$(nproc)
          # Build test binaries
          make test_streaming_api-bin test_batch_vs_streaming-bin
          # gRPC client/server + MPI multi-client/server test harness
          # (already covered by `make -j$(nproc)` above since none of
          # these are EXCLUDE_FROM_ALL, but listed explicitly here too
          # for the same clarity reason as the line above). The MPI
          # harness target only exists if find_package(MPI) succeeded at
          # configure time (see CMakeLists.txt) - `|| true` tolerates it
          # being absent rather than failing this otherwise-redundant
          # clarity line with "no rule to make target".
          make dr_evt_server-bin dr_evt_client-bin
          make test_grpc_multi_client_server-bin || true

      - name: Install
        run: |
          cd build
          make install
          echo "Installed binaries:"
          ls -lh $GITHUB_WORKSPACE/install/bin/
          echo "Installed libraries:"
          ls -lh $GITHUB_WORKSPACE/install/lib/ | head -20

      - name: Check build artifacts
        run: |
          ls -lh build/simulator
          ./build/simulator --help || true
          echo ""
          echo "Testing installed binary:"
          ls -lh install/bin/simulator
          install/bin/simulator --help || true

      - name: Run Comprehensive Tests (Build Directory)
        id: comprehensive
        run: |
          echo "========================================"
          echo "Running Comprehensive Tests (34 tests) - Build Directory"
          echo "========================================"
          # Explicitly unset CMAKE_INSTALL_PREFIX to test build directory fallback
          unset CMAKE_INSTALL_PREFIX
          ./tests/test_all_dr_evt.sh

      - name: Run Comprehensive Tests (Installed Binary)
        id: comprehensive-installed
        run: |
          echo "========================================"
          echo "Running Comprehensive Tests (34 tests) - Installed Binary"
          echo "========================================"
          export CMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install
          ./tests/test_all_dr_evt.sh

      - name: Run Queue Implementation Differential Tests
        id: queue-impl
        run: |
          echo "========================================"
          echo "Comparing deque/multimap/block/circular queue implementations"
          echo "========================================"
          ./tests/test_fcfs_comprehensive.sh --correctness

      - name: Run Column Alias Tests
        id: column-alias
        run: |
          echo "========================================"
          echo "Testing time_limit/actual_run_time column-name aliases (8 tests)"
          echo "========================================"
          ./tests/test_column_aliases.sh

      - name: Run Run Time Mode Tests
        id: run-time-mode
        run: |
          echo "========================================"
          echo "Testing run_time_mode (actual/distribution/limit) and distribution capping (7 tests)"
          echo "========================================"
          ./tests/test_run_time_modes.sh

      - name: Run Unit Tests
        id: unit
        run: |
          echo "========================================"
          echo "Running Unit Tests (7 tests)"
          echo "========================================"
          ./tests/run_unit_tests.sh

      - name: Run Feature Tests
        id: feature
        run: |
          echo "========================================"
          echo "Running Feature Tests (5 tests)"
          echo "========================================"
          ./tests/run_feature_tests.sh

      - name: Run Conservative Backfilling Tests
        id: conservative
        run: |
          echo "========================================"
          echo "Running Conservative Backfilling Tests (2 tests)"
          echo "========================================"
          echo ""
          echo "Test 1: Behavioral Correctness (EASY vs CONSERVATIVE)"
          ./tests/test_easy_vs_conservative_correctness.sh
          echo ""
          echo "Test 2: Implementation Equivalence (C++ vs Python)"
          echo "Note: Using 100 jobs for CI (full 2000-job test takes ~8 minutes)"
          ./tests/compare_cpp_python_conservative.sh tests/test_traces/scale/large_100jobs.csv 1000

      - name: Run Replay Tests
        id: replay
        run: |
          echo "========================================"
          echo "Running Replay Tests (3 tests)"
          echo "========================================"
          ./tests/run_replay_tests.sh

      - name: Run Config Tests
        id: config
        run: |
          echo "========================================"
          echo "Running Config Tests (4 tests)"
          echo "========================================"
          ./tests/run_configs_tests.sh

      - name: Run Python API Tests
        id: python-api
        run: |
          source venv/bin/activate
          echo "========================================"
          echo "Running Python API Tests (14 tests)"
          echo "========================================"
          ./tests/run_python_tests.sh

      - name: Run Streaming API Tests
        id: streaming
        run: |
          echo "========================================"
          echo "Running Streaming API Tests (4 tests)"
          echo "========================================"
          ./tests/run_streaming_tests.sh

      - name: Run gRPC Client/Server Tests
        id: grpc
        run: |
          echo "========================================"
          echo "Running gRPC Client/Server Tests (2 tests)"
          echo "========================================"
          ./tests/run_grpc_tests.sh

      - name: Run Scale Tests (Optional)
        id: scale
        continue-on-error: true
        run: |
          echo "========================================"
          echo "Running Scale Tests (6 tests)"
          echo "========================================"
          ./tests/run_scale_tests.sh

      - name: Test Summary
        if: always()
        run: |
          echo "========================================"
          echo "DR_EVT Test Suite Summary"
          echo "========================================"
          echo "Compiler: ${{ matrix.compiler }}"
          echo ""
          echo "Test Results:"
          echo "  Comprehensive - Build (34 tests): ${{ steps.comprehensive.outcome }}"
          echo "  Comprehensive - Installed (34 tests): ${{ steps.comprehensive-installed.outcome }}"
          echo "  Queue Impl Differential (34×4 impls): ${{ steps.queue-impl.outcome }}"
          echo "  Column Aliases (8 tests): ${{ steps.column-alias.outcome }}"
          echo "  Run Time Mode (7 tests): ${{ steps.run-time-mode.outcome }}"
          echo "  Unit (7 tests): ${{ steps.unit.outcome }}"
          echo "  Feature (5 tests): ${{ steps.feature.outcome }}"
          echo "  Conservative (2 tests): ${{ steps.conservative.outcome }}"
          echo "  Replay (3 tests): ${{ steps.replay.outcome }}"
          echo "  Config (4 tests): ${{ steps.config.outcome }}"
          echo "  Python API (14 tests): ${{ steps.python-api.outcome }}"
          echo "  Streaming API (4 tests): ${{ steps.streaming.outcome }}"
          echo "  gRPC Client/Server (2 tests): ${{ steps.grpc.outcome }}"
          echo "  Scale (6 tests, optional): ${{ steps.scale.outcome }}"
          echo ""
          echo "Outcome values: success | failure | skipped | cancelled"
          echo ""
          echo "Note: Scale tests use continue-on-error, so 'failure' won't fail the job."
          echo "See tests/README.md and docs/TESTING_GUIDE.md for test details."
          echo "========================================"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.compiler }}
          path: |
            /tmp/*.csv
            build/Testing/Temporary/
          retention-days: 7
