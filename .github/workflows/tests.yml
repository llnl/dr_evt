name: DR_EVT Test Suite

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-11
            cxx: g++-11
          - compiler: clang
            cc: clang-14
            cxx: clang++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libboost-all-dev \
            python3 \
            python3-pip \
            libopenmpi-dev \
            openmpi-bin \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Display versions
        run: |
          echo "=== Compiler versions ==="
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          cmake --version
          python3 --version
          echo "=== MPI version ==="
          mpirun --version
          echo "=== Boost version ==="
          dpkg -l | grep libboost-dev

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/install

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Check build artifacts
        run: |
          ls -lh build/simulator
          ./build/simulator --help || true

      - name: Run Correctness Tests
        run: |
          echo "========================================"
          echo "Running Correctness Tests (23 tests)"
          echo "========================================"
          ./tests/run_correctness_tests.sh

      - name: Run Unit Tests
        run: |
          echo "========================================"
          echo "Running Unit Tests (8 tests)"
          echo "========================================"
          ./tests/run_unit_tests.sh

      - name: Run Feature Tests
        run: |
          echo "========================================"
          echo "Running Feature Tests (13 tests)"
          echo "========================================"
          ./tests/run_feature_tests.sh

      - name: Run Replay Tests
        run: |
          echo "========================================"
          echo "Running Replay Tests (3 tests)"
          echo "========================================"
          ./tests/run_replay_tests.sh

      - name: Run Scale Tests (Optional)
        continue-on-error: true
        run: |
          echo "========================================"
          echo "Running Scale Tests (7 tests)"
          echo "========================================"
          for test_file in tests/test_traces/scale/*.csv; do
            test_name=$(basename "$test_file" .csv)
            echo "Testing: $test_name"
            ./build/simulator "$test_file" \
              --total_nodes 100 \
              --trace_format simple \
              --timestamp_format epoch \
              --duration_mode exact \
              --outfile /tmp/scale_$test_name.csv
            echo "  ✓ PASS"
          done

      - name: Test Summary
        if: always()
        run: |
          echo "========================================"
          echo "DR_EVT Test Suite Summary"
          echo "========================================"
          echo "Compiler: ${{ matrix.compiler }}"
          echo ""
          echo "Test Results:"
          echo "  Correctness: 23 tests"
          echo "  Unit: 8 tests"
          echo "  Feature: 13 tests"
          echo "  Replay: 3 tests"
          echo "  Scale: 7 tests"
          echo ""
          echo "Total: 54 tests"
          echo "========================================"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs-${{ matrix.compiler }}
          path: |
            /tmp/*.csv
            build/Testing/Temporary/
          retention-days: 7
