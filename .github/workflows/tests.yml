name: DR_EVT Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-11
            cxx: g++-11
          - compiler: clang
            cc: clang-14
            cxx: clang++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libboost-all-dev \
            python3 \
            python3-pip \
            libopenmpi-dev \
            openmpi-bin \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Display versions
        run: |
          echo "=== Compiler versions ==="
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          cmake --version
          python3 --version
          echo "=== MPI version ==="
          mpirun --version
          echo "=== Boost version ==="
          dpkg -l | grep libboost-dev

      - name: Create Python virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          source venv/bin/activate
          # Explicitly pin Python3_EXECUTABLE to the active venv's
          # interpreter. find_package(Python3) in SetupPybind11.cmake
          # does not reliably pick up an activated venv on its own across
          # CMake versions/environments - without this, it can silently
          # resolve to a different system Python (e.g. Ubuntu 24.04's
          # default 3.12) even with the venv active, producing a
          # dr_evt.cpython-312-*.so that the venv's own 3.9 interpreter
          # can never import (compiled extension modules are ABI-specific
          # to their build interpreter's version).
          PYTHON_EXE=$(command -v python3)
          echo "Building Python bindings against: $PYTHON_EXE ($($PYTHON_EXE --version))"
          # Fresh build directory: avoids picking up a stale .so left over
          # from an earlier configure against a different Python version.
          rm -rf build
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DDR_EVT_BUILD_PYTHON=ON \
            -DPython3_EXECUTABLE=$PYTHON_EXE

      - name: Build
        run: |
          source venv/bin/activate
          cd build
          make -j$(nproc)
          # Build test binaries
          make test_streaming_api-bin test_batch_vs_streaming-bin

      - name: Check build artifacts
        run: |
          ls -lh build/simulator
          ./build/simulator --help || true

      - name: Run Comprehensive Tests
        run: |
          echo "========================================"
          echo "Running Comprehensive Tests (34 tests)"
          echo "========================================"
          ./tests/test_all_dr_evt.sh

      - name: Run Unit Tests
        run: |
          echo "========================================"
          echo "Running Unit Tests (7 tests)"
          echo "========================================"
          ./tests/run_unit_tests.sh

      - name: Run Feature Tests
        run: |
          echo "========================================"
          echo "Running Feature Tests (3 tests)"
          echo "========================================"
          ./tests/run_feature_tests.sh

      - name: Run Replay Tests
        run: |
          echo "========================================"
          echo "Running Replay Tests (3 tests)"
          echo "========================================"
          ./tests/run_replay_tests.sh

      - name: Run Config Tests
        run: |
          echo "========================================"
          echo "Running Config Tests (4 tests)"
          echo "========================================"
          ./tests/run_configs_tests.sh

      - name: Run Python API Tests
        run: |
          source venv/bin/activate
          echo "========================================"
          echo "Running Python API Tests (9 tests)"
          echo "========================================"
          ./tests/run_python_tests.sh

      - name: Run Streaming API Tests
        run: |
          echo "========================================"
          echo "Running Streaming API Tests (4 tests)"
          echo "========================================"
          ./tests/run_streaming_tests.sh

      - name: Run Scale Tests (Optional)
        continue-on-error: true
        run: |
          echo "========================================"
          echo "Running Scale Tests (7 tests, 3 known-corrupted input)"
          echo "========================================"
          # NOTE: scale/ jobs require 795 nodes (matches src/dr_evt_types.hpp's
          # default), NOT 100 - several jobs request up to 497 nodes and
          # cannot be scheduled at all under 100. Using --total_nodes 100
          # here previously caused jobs to silently never start.
          for test_file in tests/test_traces/scale/*.csv; do
            # The glob above also matches *.expected_output.csv and
            # *.expected_resources.csv (they end in .csv too) - without
            # this exclusion, the loop tries to run the simulator on an
            # expected-output file as if it were an input trace, which
            # fails with a parse error unrelated to the actual scale
            # tests below.
            case "$test_file" in
              *.expected_output.csv|*.expected_resources.csv) continue ;;
            esac
            test_name=$(basename "$test_file" .csv)
            echo "Testing: $test_name"
            ./build/simulator "$test_file" \
              --total_nodes 795 \
              --trace_format simple \
              --timestamp_format epoch \
              --duration_mode exact \
              --outfile /tmp/scale_$test_name.csv
            expected="tests/test_traces/scale/${test_name}.expected_output.csv"
            if [ -f "$expected" ]; then
              awk -F, 'NR==1{print "job_id,start_time,end_time";next}{print NR-2","$2","$3}' /tmp/scale_$test_name.csv > /tmp/scale_${test_name}_comparable.csv
              if diff -w "$expected" /tmp/scale_${test_name}_comparable.csv > /dev/null 2>&1; then
                echo "  ✓ PASS (matches expected output)"
              else
                echo "  ✗ MISMATCH (or, for xlarge_500jobs/xlarge_500jobs_v2/huge_2000jobs: known-corrupted input data, excluded from the expected-output generator)"
              fi
            else
              echo "  ⊘ ran, but no expected output to compare against"
            fi
          done

      - name: Test Summary
        if: always()
        run: |
          echo "========================================"
          echo "DR_EVT Test Suite Summary"
          echo "========================================"
          echo "Compiler: ${{ matrix.compiler }}"
          echo ""
          echo "Test Results:"
          echo "  Comprehensive: 34 tests (verified 34/34 in a manual session pass)"
          echo "  Unit: 7 tests (5/7 - 2 known-broken, incomplete fixture data)"
          echo "  Feature: 3 tests"
          echo "  Replay: 3 tests (methodology also verified against more)"
          echo "  Config: 4 tests (skipped without -DDR_EVT_ENABLE_PROTOBUF=ON)"
          echo "  Python API: 9 tests (requires -DDR_EVT_BUILD_PYTHON=ON)"
          echo "  Streaming API: 4 tests (requires building test_streaming_api)"
          echo "  Scale: 7 tests, optional (4 working, 3 known-corrupted input data)"
          echo ""
          echo "These counts reflect what this workflow attempts to run, not"
          echo "an independently re-verified total on every commit - see"
          echo "tests/README.md and docs/TESTING_GUIDE.md for known"
          echo "limitations and what 'passing' does and doesn't demonstrate."
          echo "========================================"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.compiler }}
          path: |
            /tmp/*.csv
            build/Testing/Temporary/
          retention-days: 7
