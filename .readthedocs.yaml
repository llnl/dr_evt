# Read the Docs configuration file for DR_EVT
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Set the version of Python and required tools
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      # Install any additional system dependencies if needed
      - echo "Build started"

# Python requirements
python:
  install:
    - requirements: docs/requirements.txt

# Formats to build (HTML and PDF)
formats:
  - pdf
  - epub
