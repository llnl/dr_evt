# Read the Docs configuration file for DR_EVT
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Set the version of Python and required tools
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      # Build the optional C++ reference before Read the Docs invokes Sphinx.
      # Sphinx still publishes the hand-written documentation when Doxygen is
      # not installed in the build image.
      - if command -v doxygen >/dev/null 2>&1; then doxygen docs/Doxyfile; else echo "Doxygen is unavailable; skipping the C++ API reference."; fi

# Python requirements
python:
  install:
    - requirements: docs/requirements.txt

# Formats to build (HTML and PDF)
formats:
  - pdf
  - epub
