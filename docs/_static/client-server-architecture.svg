<svg xmlns="http://www.w3.org/2000/svg" width="930" height="315" viewBox="50 35 930 315" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Scalable DR_EVT gRPC deployment</title>
  <desc id="description">Workload sources feed one or more client processes or digital-twin controllers. They use independent bidirectional gRPC sessions with one or more DR_EVT server processes. Each session owns an isolated simulation with its own scheduler state and nodes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8792"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 600; fill: #26323c; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #52606b; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #6d7b86; letter-spacing: .8px; }
      .badge { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #52606b; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 600; fill: #687782; }
    </style>
  </defs>

  <rect width="1280" height="420" fill="#ffffff"/>
  <text x="60" y="55" class="small">SCALABLE CLIENT / SERVER ARCHITECTURE</text>
  <line x1="60" y1="72" x2="970" y2="72" stroke="#e3e8eb" stroke-width="1"/>
  <text x="60" y="105" class="body">Clients and servers scale independently; a server creates an isolated simulation for every session.</text>

  <!-- workload sources -->
  <g filter="url(#shadow)">
    <rect x="60" y="181" width="120" height="135" rx="12" fill="#fbfcfc" stroke="#d8e0e4" stroke-width="1.5"/>
  </g>
  <text x="72" y="215" class="small">INPUT</text>
  <text x="72" y="246" class="title">Workload</text>
  <text x="72" y="271" class="body"><tspan x="72" dy="0">- Trace</tspan><tspan x="72" dy="17">- Live feed</tspan></text>

  <!-- client processes: the offset cards indicate multiple concurrent clients -->
  <rect x="236" y="163" width="170" height="150" rx="12" fill="#f4f7f8" stroke="#d8e0e4" stroke-width="1.2"/>
  <rect x="228" y="169" width="170" height="150" rx="12" fill="#f8fafb" stroke="#d3dce1" stroke-width="1.2"/>
  <g filter="url(#shadow)">
    <rect x="220" y="175" width="170" height="150" rx="12" fill="#fbfcfc" stroke="#cfd9df" stroke-width="1.5"/>
  </g>
  <text x="238" y="211" class="title">Client</text>
  <text x="238" y="235" class="body"><tspan x="238" dy="0">C++ or Python</tspan><tspan x="238" dy="17">with gRPC</tspan></text>
  <line x1="244" y1="264" x2="366" y2="264" stroke="#e1e7ea" stroke-width="1"/>
  <text x="238" y="281" class="body"><tspan x="238" dy="0">- Read job inputs</tspan><tspan x="238" dy="17">- Control progress</tspan></text>

  <!-- server processes: the offset cards indicate multiple concurrent servers -->
  <rect x="561" y="163" width="195" height="150" rx="12" fill="#f4f7f8" stroke="#d8e0e4" stroke-width="1.2"/>
  <rect x="553" y="169" width="195" height="150" rx="12" fill="#f8fafb" stroke="#d3dce1" stroke-width="1.2"/>
  <g filter="url(#shadow)">
    <rect x="545" y="175" width="195" height="150" rx="12" fill="#fbfcfc" stroke="#cfd9df" stroke-width="1.5"/>
  </g>
  <text x="563" y="211" class="title">Server</text>
  <text x="563" y="235" class="body"><tspan x="563" dy="0">C++ process</tspan><tspan x="563" dy="17">with gRPC</tspan></text>
  <line x1="569" y1="264" x2="716" y2="264" stroke="#e1e7ea" stroke-width="1"/>
  <text x="563" y="281" class="body"><tspan x="563" dy="0">- Open gRPC endpoint</tspan></text>

  <!-- simulations: the stack shows one concurrent instance per session -->
  <rect x="796" y="191" width="150" height="140" rx="12" fill="#f4f7f8" stroke="#d8e0e4" stroke-width="1.2"/>
  <rect x="788" y="183" width="150" height="140" rx="12" fill="#f8fafb" stroke="#d3dce1" stroke-width="1.2"/>
  <g filter="url(#shadow)">
    <rect x="780" y="175" width="150" height="140" rx="12" fill="#fbfcfc" stroke="#d8e0e4" stroke-width="1.5"/>
  </g>
  <text x="798" y="209" class="small">PER SESSION</text>
  <text x="798" y="240" class="title">Simulation</text>
  <text x="798" y="264" class="body"><tspan x="798" dy="0">C++</tspan><tspan x="798" dy="17">Maintain states</tspan></text>

  <!-- direct Python binding -->
  <g filter="url(#shadow)">
    <rect x="780" y="100" width="150" height="45" rx="12" fill="#fbfcfc" stroke="#d8e0e4" stroke-width="1.5"/>
  </g>
  <text x="798" y="128" class="body" style="font-weight:600">Python API</text>

  <!-- connections, drawn last for crisp arrows -->
  <line x1="180" y1="240" x2="217" y2="240" stroke="#7a8792" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="390" y1="231" x2="542" y2="231" stroke="#7a8792" stroke-width="1.35" marker-end="url(#arrow)"/>
  <line x1="390" y1="240" x2="542" y2="240" stroke="#7a8792" stroke-width="1.35" marker-end="url(#arrow)"/>
  <line x1="390" y1="249" x2="542" y2="249" stroke="#7a8792" stroke-width="1.35" marker-end="url(#arrow)"/>
  <text x="468" y="195" class="label" text-anchor="middle"><tspan x="468" dy="0">N independent</tspan><tspan x="468" dy="16">gRPC sessions</tspan></text>
  <line x1="740" y1="231" x2="777" y2="231" stroke="#7a8792" stroke-width="1.35" marker-end="url(#arrow)"/>
  <line x1="740" y1="240" x2="777" y2="240" stroke="#7a8792" stroke-width="1.35" marker-end="url(#arrow)"/>
  <line x1="740" y1="249" x2="777" y2="249" stroke="#7a8792" stroke-width="1.35" marker-end="url(#arrow)"/>
  <line x1="855" y1="145" x2="855" y2="163" stroke="#7a8792" stroke-width="1.7"/>
  <path d="M848 163 L855 172 L862 163 Z" fill="#7a8792"/>

</svg>
