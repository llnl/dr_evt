<?xml version="1.0" encoding="UTF-8"?>
<svg width="196" height="128" viewBox="0 0 196 128" xmlns="http://www.w3.org/2000/svg">
  <!-- DR_EVT Logo - Streams flow around circular clock -->

  <defs>
    <radialGradient id="clockGradient" cx="35%" cy="35%" r="70%">
      <stop offset="0%" style="stop-color:#4a5f73;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3c4e60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a3540;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glassHighlight" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00aadd;stop-opacity:1" />
    </linearGradient>
    <filter id="cyberGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background - lighter -->
  <rect width="196" height="128" fill="#1a2530"/>

  <!-- Clock centered at x=128, y=64 (radius ~56px means left edge ~72, widest at y=64) -->

  <!-- Direction lines - longer at top/bottom (clock narrower), shorter in middle (clock wider) -->
  <!-- Top streams - reach closer (to ~x=132) -->
  <line x1="0" y1="10" x2="132" y2="10" stroke="#00e6ff" stroke-width="1" opacity="0.35"/>
  <line x1="0" y1="22" x2="130" y2="22" stroke="#00aadd" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="34" x2="128" y2="34" stroke="#00e6ff" stroke-width="1" opacity="0.35"/>

  <!-- Middle streams - shorter (clock is widest here, stops at ~x=116) -->
  <line x1="0" y1="46" x2="116" y2="46" stroke="#0099cc" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="58" x2="114" y2="58" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="70" x2="114" y2="70" stroke="#0099cc" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="82" x2="116" y2="82" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>

  <!-- Bottom streams - reach closer again (to ~x=132) -->
  <line x1="0" y1="94" x2="128" y2="94" stroke="#0099cc" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="106" x2="130" y2="106" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="118" x2="132" y2="118" stroke="#0099cc" stroke-width="1" opacity="0.15"/>

  <!-- Arrows at line ends - positioned based on line length -->
  <polygon points="128,8 132,10 128,12" fill="#00d4ff" opacity="0.3"/>
  <polygon points="126,20 130,22 126,24" fill="#0099cc" opacity="0.25"/>
  <polygon points="124,32 128,34 124,36" fill="#00d4ff" opacity="0.3"/>
  <polygon points="112,44 116,46 112,48" fill="#0099cc" opacity="0.25"/>
  <polygon points="110,56 114,58 110,60" fill="#00d4ff" opacity="0.25"/>
  <polygon points="110,68 114,70 110,72" fill="#0099cc" opacity="0.25"/>
  <polygon points="112,80 116,82 112,84" fill="#00d4ff" opacity="0.3"/>
  <polygon points="124,92 128,94 124,96" fill="#0099cc" opacity="0.25"/>
  <polygon points="126,104 130,106 126,108" fill="#00d4ff" opacity="0.25"/>
  <polygon points="128,116 132,118 128,120" fill="#0099cc" opacity="0.25"/>

  <!-- Event Streams - vary length based on clock shape -->

  <!-- TOP streams - extend further (y=8-34) -->
  <!-- Stream 1 (y=8) - reaches x=128 -->
  <rect x="0" y="8" width="4" height="4" fill="#00e6ff" opacity="0.95"/>
  <rect x="16" y="8" width="4" height="4" fill="#00e6ff" opacity="0.85"/>
  <rect x="32" y="8" width="4" height="4" fill="#00e6ff" opacity="0.75"/>
  <rect x="48" y="8" width="4" height="4" fill="#00e6ff" opacity="0.65"/>
  <rect x="64" y="8" width="4" height="4" fill="#00e6ff" opacity="0.55"/>
  <rect x="80" y="8" width="4" height="4" fill="#00e6ff" opacity="0.45"/>
  <rect x="96" y="8" width="4" height="4" fill="#00e6ff" opacity="0.35"/>
  <rect x="112" y="8" width="4" height="4" fill="#00e6ff" opacity="0.25"/>
  <rect x="124" y="8" width="4" height="4" fill="#00e6ff" opacity="0.2"/>

  <!-- Stream 2 (y=20) - reaches x=126 -->
  <rect x="8" y="20" width="4" height="4" fill="#0099cc" opacity="0.7"/>
  <rect x="24" y="20" width="4" height="4" fill="#0099cc" opacity="0.6"/>
  <rect x="40" y="20" width="4" height="4" fill="#0099cc" opacity="0.5"/>
  <rect x="56" y="20" width="4" height="4" fill="#0099cc" opacity="0.4"/>
  <rect x="72" y="20" width="4" height="4" fill="#0099cc" opacity="0.3"/>
  <rect x="88" y="20" width="4" height="4" fill="#0099cc" opacity="0.25"/>
  <rect x="104" y="20" width="4" height="4" fill="#0099cc" opacity="0.2"/>
  <rect x="120" y="20" width="4" height="4" fill="#0099cc" opacity="0.15"/>

  <!-- Stream 3 (y=32) - dense, reaches x=124 -->
  <rect x="4" y="32" width="4" height="4" fill="#00d4ff" opacity="0.9"/>
  <rect x="16" y="32" width="4" height="4" fill="#00d4ff" opacity="0.8"/>
  <rect x="28" y="32" width="4" height="4" fill="#00d4ff" opacity="0.7"/>
  <rect x="40" y="32" width="4" height="4" fill="#00d4ff" opacity="0.6"/>
  <rect x="52" y="32" width="4" height="4" fill="#00d4ff" opacity="0.5"/>
  <rect x="64" y="32" width="4" height="4" fill="#00d4ff" opacity="0.4"/>
  <rect x="76" y="32" width="4" height="4" fill="#00d4ff" opacity="0.3"/>
  <rect x="88" y="32" width="4" height="4" fill="#00d4ff" opacity="0.25"/>
  <rect x="100" y="32" width="4" height="4" fill="#00d4ff" opacity="0.2"/>
  <rect x="112" y="32" width="4" height="4" fill="#00d4ff" opacity="0.15"/>

  <!-- MIDDLE streams - shorter (y=44-82, clock widest) -->
  <!-- Stream 4 (y=44) - stops at x=112 -->
  <rect x="12" y="44" width="4" height="4" fill="#0099cc" opacity="0.6"/>
  <rect x="36" y="44" width="4" height="4" fill="#0099cc" opacity="0.5"/>
  <rect x="60" y="44" width="4" height="4" fill="#0099cc" opacity="0.4"/>
  <rect x="84" y="44" width="4" height="4" fill="#0099cc" opacity="0.3"/>
  <rect x="104" y="44" width="4" height="4" fill="#0099cc" opacity="0.2"/>

  <!-- Stream 5 (y=56) - stops at x=110 -->
  <rect x="20" y="56" width="4" height="4" fill="#00d4ff" opacity="0.7"/>
  <rect x="44" y="56" width="4" height="4" fill="#00d4ff" opacity="0.5"/>
  <rect x="68" y="56" width="4" height="4" fill="#00d4ff" opacity="0.4"/>
  <rect x="92" y="56" width="4" height="4" fill="#00d4ff" opacity="0.3"/>

  <!-- Stream 6 (y=68) - stops at x=110 -->
  <rect x="8" y="68" width="4" height="4" fill="#0099cc" opacity="0.6"/>
  <rect x="28" y="68" width="4" height="4" fill="#0099cc" opacity="0.5"/>
  <rect x="48" y="68" width="4" height="4" fill="#0099cc" opacity="0.4"/>
  <rect x="68" y="68" width="4" height="4" fill="#0099cc" opacity="0.3"/>
  <rect x="88" y="68" width="4" height="4" fill="#0099cc" opacity="0.2"/>

  <!-- Stream 7 (y=80) - stops at x=112 -->
  <rect x="0" y="80" width="4" height="4" fill="#00d4ff" opacity="0.8"/>
  <rect x="16" y="80" width="4" height="4" fill="#00d4ff" opacity="0.6"/>
  <rect x="32" y="80" width="4" height="4" fill="#00d4ff" opacity="0.5"/>
  <rect x="48" y="80" width="4" height="4" fill="#00d4ff" opacity="0.4"/>
  <rect x="64" y="80" width="4" height="4" fill="#00d4ff" opacity="0.3"/>
  <rect x="80" y="80" width="4" height="4" fill="#00d4ff" opacity="0.25"/>
  <rect x="96" y="80" width="4" height="4" fill="#00d4ff" opacity="0.2"/>

  <!-- BOTTOM streams - extend further again (y=92-118) -->
  <!-- Stream 8 (y=92) - reaches x=124 -->
  <rect x="4" y="92" width="4" height="4" fill="#0099cc" opacity="0.8"/>
  <rect x="16" y="92" width="4" height="4" fill="#0099cc" opacity="0.7"/>
  <rect x="28" y="92" width="4" height="4" fill="#0099cc" opacity="0.6"/>
  <rect x="40" y="92" width="4" height="4" fill="#0099cc" opacity="0.5"/>
  <rect x="52" y="92" width="4" height="4" fill="#0099cc" opacity="0.4"/>
  <rect x="64" y="92" width="4" height="4" fill="#0099cc" opacity="0.35"/>
  <rect x="76" y="92" width="4" height="4" fill="#0099cc" opacity="0.3"/>
  <rect x="88" y="92" width="4" height="4" fill="#0099cc" opacity="0.25"/>
  <rect x="100" y="92" width="4" height="4" fill="#0099cc" opacity="0.2"/>
  <rect x="112" y="92" width="4" height="4" fill="#0099cc" opacity="0.15"/>

  <!-- Stream 9 (y=104) - reaches x=126 -->
  <rect x="12" y="104" width="4" height="4" fill="#00d4ff" opacity="0.6"/>
  <rect x="32" y="104" width="4" height="4" fill="#00d4ff" opacity="0.5"/>
  <rect x="52" y="104" width="4" height="4" fill="#00d4ff" opacity="0.4"/>
  <rect x="72" y="104" width="4" height="4" fill="#00d4ff" opacity="0.35"/>
  <rect x="92" y="104" width="4" height="4" fill="#00d4ff" opacity="0.3"/>
  <rect x="112" y="104" width="4" height="4" fill="#00d4ff" opacity="0.2"/>

  <!-- Stream 10 (y=116) - reaches x=128 -->
  <rect x="8" y="116" width="4" height="4" fill="#0099cc" opacity="0.5"/>
  <rect x="28" y="116" width="4" height="4" fill="#0099cc" opacity="0.4"/>
  <rect x="48" y="116" width="4" height="4" fill="#0099cc" opacity="0.35"/>
  <rect x="68" y="116" width="4" height="4" fill="#0099cc" opacity="0.3"/>
  <rect x="88" y="116" width="4" height="4" fill="#0099cc" opacity="0.25"/>
  <rect x="108" y="116" width="4" height="4" fill="#0099cc" opacity="0.2"/>
  <rect x="124" y="116" width="4" height="4" fill="#0099cc" opacity="0.15"/>

  <!-- Clock centered at x=128, y=64 -->
  <g transform="translate(128, 0)" filter="url(#dropShadow)">
    <!-- Clock face - smooth circular -->
    <ellipse cx="0" cy="64" rx="56" ry="56" fill="url(#clockGradient)" opacity="0.95"/>

    <!-- Glass highlight overlay for water drop effect -->
    <ellipse cx="-12" cy="48" rx="32" ry="28" fill="url(#glassHighlight)"/>

    <!-- Subtle rim highlight (top-left edge) -->
    <ellipse cx="-8" cy="50" rx="28" ry="24" fill="#ffffff" opacity="0.08"/>

    <!-- Hour markers - squares at 12, 3, 6, 9 (radius ~50px from center) -->
    <rect x="-3" y="11" width="6" height="6" fill="#00d4ff" filter="url(#cyberGlow)"/>
    <rect x="47" y="61" width="6" height="6" fill="#00d4ff" filter="url(#cyberGlow)"/>
    <rect x="-3" y="111" width="6" height="6" fill="#00d4ff" filter="url(#cyberGlow)"/>
    <rect x="-53" y="61" width="6" height="6" fill="#00d4ff" filter="url(#cyberGlow)"/>

    <!-- Subtle dots at radius ~50px -->
    <rect x="24" y="20" width="3" height="3" fill="#00d4ff" opacity="0.4"/>   <!-- 1 o'clock -->
    <rect x="42" y="38" width="3" height="3" fill="#00d4ff" opacity="0.4"/>   <!-- 2 o'clock -->
    <rect x="24" y="106" width="3" height="3" fill="#00d4ff" opacity="0.4"/>  <!-- 4 o'clock -->
    <rect x="42" y="88" width="3" height="3" fill="#00d4ff" opacity="0.4"/>   <!-- 5 o'clock -->
    <rect x="-44" y="88" width="3" height="3" fill="#00d4ff" opacity="0.4"/>  <!-- 7 o'clock -->
    <rect x="-26" y="106" width="3" height="3" fill="#00d4ff" opacity="0.4"/> <!-- 8 o'clock -->
    <rect x="-26" y="20" width="3" height="3" fill="#00d4ff" opacity="0.4"/>  <!-- 10 o'clock -->
    <rect x="-44" y="38" width="3" height="3" fill="#00d4ff" opacity="0.4"/>  <!-- 11 o'clock -->

    <!-- Hour hand - very pixelated with 6x6 blocks -->
    <rect x="-3" y="58" width="6" height="6" fill="url(#handGradient)"/>
    <rect x="-9" y="52" width="6" height="6" fill="url(#handGradient)"/>
    <rect x="-15" y="46" width="6" height="6" fill="url(#handGradient)"/>
    <rect x="-21" y="40" width="6" height="6" fill="url(#handGradient)"/>

    <!-- Minute hand - very pixelated with 6x6 blocks -->
    <rect x="3" y="58" width="6" height="6" fill="url(#handGradient)"/>
    <rect x="9" y="52" width="6" height="6" fill="url(#handGradient)"/>
    <rect x="15" y="46" width="6" height="6" fill="url(#handGradient)"/>
    <rect x="21" y="40" width="6" height="6" fill="url(#handGradient)"/>
    <rect x="27" y="34" width="6" height="6" fill="url(#handGradient)"/>
    <rect x="33" y="28" width="6" height="6" fill="url(#handGradient)"/>

    <!-- Center pivot -->
    <ellipse cx="0" cy="64" rx="7" ry="7" fill="#34495e"/>
    <ellipse cx="0" cy="64" rx="5" ry="5" fill="#00d4ff" opacity="0.8"/>
    <ellipse cx="-1" cy="63" rx="2" ry="2" fill="#80e5ff"/>
  </g>
</svg>
