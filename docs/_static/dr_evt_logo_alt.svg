  <rect x="52" y="92" width="4" height="4" fill="#dd7744" opacity="0.5"/>
  <rect x="64" y="92" width="4" height="4" fill="#dd7744" opacity="0.4"/>
  <rect x="76" y="92" width="4" height="4" fill="#dd7744" opacity="0.35"/>
  <rect x="88" y="92" width="4" height="4" fill="#dd7744" opacity="0.3"/>
  <rect x="100" y="92" width="4" height="4" fill="#dd7744" opacity="0.25"/>
  <rect x="112" y="92" width="4" height="4" fill="#dd7744" opacity="0.2"/>

  <rect x="12" y="104" width="4" height="4" fill="#ff8844" opacity="0.7"/>
  <rect x="32" y="104" width="4" height="4" fill="#ff8844" opacity="0.6"/>
  <rect x="52" y="104" width="4" height="4" fill="#ff8844" opacity="0.5"/>
  <rect x="72" y="104" width="4" height="4" fill="#ff8844" opacity="0.4"/>
  <rect x="92" y="104" width="4" height="4" fill="#ff8844" opacity="0.3"/>
  <rect x="112" y="104" width="4" height="4" fill="#ff8844" opacity="0.25"/>

  <rect x="8" y="116" width="4" height="4" fill="#dd7744" opacity="0.6"/>
  <rect x="28" y="116" width="4" height="4" fill="#dd7744" opacity="0.5"/>
  <rect x="48" y="116" width="4" height="4" fill="#dd7744" opacity="0.4"/>
  <rect x="68" y="116" width="4" height="4" fill="#dd7744" opacity="0.35"/>
  <rect x="88" y="116" width="4" height="4" fill="#dd7744" opacity="0.3"/>
  <rect x="108" y="116" width="4" height="4" fill="#dd7744" opacity="0.25"/>
  <rect x="124" y="116" width="4" height="4" fill="#dd7744" opacity="0.2"/>

  <!-- Clock centered at x=128, y=64 -->
  <g transform="translate(128, 0)" filter="url(#dropShadowAlt)">
    <!-- Clock face - smooth circular -->
    <ellipse cx="0" cy="64" rx="56" ry="56" fill="url(#clockGradientAlt)" opacity="0.95"/>

    <ellipse cx="-12" cy="48" rx="32" ry="28" fill="url(#glassHighlightAlt)"/>
    <ellipse cx="-8" cy="50" rx="28" ry="24" fill="#ff9955" opacity="0.12"/>

    <!-- Hour markers - squares at 12, 3, 6, 9 (radius ~50px from center) -->
    <rect x="-3" y="11" width="6" height="6" fill="#ff8844" filter="url(#cyberGlowAlt)"/>
    <rect x="47" y="61" width="6" height="6" fill="#ff8844" filter="url(#cyberGlowAlt)"/>
    <rect x="-3" y="111" width="6" height="6" fill="#ff8844" filter="url(#cyberGlowAlt)"/>
    <rect x="-53" y="61" width="6" height="6" fill="#ff8844" filter="url(#cyberGlowAlt)"/>

    <!-- Subtle dots at radius ~50px -->
    <rect x="24" y="20" width="3" height="3" fill="#ff8844" opacity="0.5"/>   <!-- 1 o'clock -->
    <rect x="42" y="38" width="3" height="3" fill="#ff8844" opacity="0.5"/>   <!-- 2 o'clock -->
    <rect x="24" y="106" width="3" height="3" fill="#ff8844" opacity="0.5"/>  <!-- 4 o'clock -->
    <rect x="42" y="88" width="3" height="3" fill="#ff8844" opacity="0.5"/>   <!-- 5 o'clock -->
    <rect x="-44" y="88" width="3" height="3" fill="#ff8844" opacity="0.5"/>  <!-- 7 o'clock -->
    <rect x="-26" y="106" width="3" height="3" fill="#ff8844" opacity="0.5"/> <!-- 8 o'clock -->
    <rect x="-26" y="20" width="3" height="3" fill="#ff8844" opacity="0.5"/>  <!-- 10 o'clock -->
    <rect x="-44" y="38" width="3" height="3" fill="#ff8844" opacity="0.5"/>  <!-- 11 o'clock -->

    <!-- Hour hand - very pixelated with 6x6 blocks -->
    <rect x="-3" y="58" width="6" height="6" fill="url(#handGradientAlt)"/>
    <rect x="-9" y="52" width="6" height="6" fill="url(#handGradientAlt)"/>
    <rect x="-15" y="46" width="6" height="6" fill="url(#handGradientAlt)"/>
    <rect x="-21" y="40" width="6" height="6" fill="url(#handGradientAlt)"/>

    <!-- Minute hand - very pixelated with 6x6 blocks -->
    <rect x="3" y="58" width="6" height="6" fill="url(#handGradientAlt)"/>
    <rect x="9" y="52" width="6" height="6" fill="url(#handGradientAlt)"/>
    <rect x="15" y="46" width="6" height="6" fill="url(#handGradientAlt)"/>
    <rect x="21" y="40" width="6" height="6" fill="url(#handGradientAlt)"/>
    <rect x="27" y="34" width="6" height="6" fill="url(#handGradientAlt)"/>
    <rect x="33" y="28" width="6" height="6" fill="url(#handGradientAlt)"/>

    <ellipse cx="0" cy="64" rx="7" ry="7" fill="#553344"/>
    <ellipse cx="0" cy="64" rx="5" ry="5" fill="#ff8844" opacity="0.9"/>
    <ellipse cx="-1" cy="63" rx="2" ry="2" fill="#ffaa66"/>
