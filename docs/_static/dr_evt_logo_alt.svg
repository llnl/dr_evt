<?xml version="1.0" encoding="UTF-8"?>
<svg width="196" height="128" viewBox="0 0 196 128" xmlns="http://www.w3.org/2000/svg">
  <!-- DR_EVT Logo - ALT: Orange/warm color palette -->

  <defs>
    <radialGradient id="clockGradientAlt" cx="35%" cy="35%" r="70%">
      <stop offset="0%" style="stop-color:#3d3540;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d2530;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d1520;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glassHighlightAlt" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#ff9955;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ff9955;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ff9955;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="handGradientAlt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8844;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd6633;stop-opacity:1" />
    </linearGradient>
    <filter id="cyberGlowAlt">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadowAlt">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="196" height="128" fill="#18141a"/>

  <!-- Direction lines -->
  <line x1="0" y1="10" x2="132" y2="10" stroke="#ff8844" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="22" x2="130" y2="22" stroke="#dd7744" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="34" x2="128" y2="34" stroke="#ff8844" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="46" x2="116" y2="46" stroke="#dd7744" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="58" x2="114" y2="58" stroke="#ff8844" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="70" x2="114" y2="70" stroke="#dd7744" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="82" x2="116" y2="82" stroke="#ff8844" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="94" x2="128" y2="94" stroke="#dd7744" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="106" x2="130" y2="106" stroke="#ff8844" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="118" x2="132" y2="118" stroke="#dd7744" stroke-width="1" opacity="0.25"/>

  <!-- Arrows -->
  <polygon points="128,8 132,10 128,12" fill="#ff8844" opacity="0.4"/>
  <polygon points="126,20 130,22 126,24" fill="#dd7744" opacity="0.35"/>
  <polygon points="124,32 128,34 124,36" fill="#ff8844" opacity="0.4"/>
  <polygon points="112,44 116,46 112,48" fill="#dd7744" opacity="0.35"/>
  <polygon points="110,56 114,58 110,60" fill="#ff8844" opacity="0.35"/>
  <polygon points="110,68 114,70 110,72" fill="#dd7744" opacity="0.35"/>
  <polygon points="112,80 116,82 112,84" fill="#ff8844" opacity="0.4"/>
  <polygon points="124,92 128,94 124,96" fill="#dd7744" opacity="0.35"/>
  <polygon points="126,104 130,106 126,108" fill="#ff8844" opacity="0.35"/>
  <polygon points="128,116 132,118 128,120" fill="#dd7744" opacity="0.35"/>

  <!-- Event Streams - warm colors -->
  <rect x="0" y="8" width="4" height="4" fill="#ff8844" opacity="0.9"/>
  <rect x="16" y="8" width="4" height="4" fill="#ff8844" opacity="0.8"/>
  <rect x="32" y="8" width="4" height="4" fill="#ff8844" opacity="0.7"/>
  <rect x="48" y="8" width="4" height="4" fill="#ff8844" opacity="0.6"/>
  <rect x="64" y="8" width="4" height="4" fill="#ff8844" opacity="0.5"/>
  <rect x="80" y="8" width="4" height="4" fill="#ff8844" opacity="0.4"/>
  <rect x="96" y="8" width="4" height="4" fill="#ff8844" opacity="0.3"/>
  <rect x="112" y="8" width="4" height="4" fill="#ff8844" opacity="0.25"/>
  <rect x="124" y="8" width="4" height="4" fill="#ff8844" opacity="0.2"/>

  <rect x="8" y="20" width="4" height="4" fill="#dd7744" opacity="0.8"/>
  <rect x="24" y="20" width="4" height="4" fill="#dd7744" opacity="0.7"/>
  <rect x="40" y="20" width="4" height="4" fill="#dd7744" opacity="0.6"/>
  <rect x="56" y="20" width="4" height="4" fill="#dd7744" opacity="0.5"/>
  <rect x="72" y="20" width="4" height="4" fill="#dd7744" opacity="0.4"/>
  <rect x="88" y="20" width="4" height="4" fill="#dd7744" opacity="0.3"/>
  <rect x="104" y="20" width="4" height="4" fill="#dd7744" opacity="0.25"/>
  <rect x="120" y="20" width="4" height="4" fill="#dd7744" opacity="0.2"/>

  <rect x="4" y="32" width="4" height="4" fill="#ff8844" opacity="1.0"/>
  <rect x="16" y="32" width="4" height="4" fill="#ff8844" opacity="0.9"/>
  <rect x="28" y="32" width="4" height="4" fill="#ff8844" opacity="0.8"/>
  <rect x="40" y="32" width="4" height="4" fill="#ff8844" opacity="0.7"/>
  <rect x="52" y="32" width="4" height="4" fill="#ff8844" opacity="0.6"/>
  <rect x="64" y="32" width="4" height="4" fill="#ff8844" opacity="0.5"/>
  <rect x="76" y="32" width="4" height="4" fill="#ff8844" opacity="0.4"/>
  <rect x="88" y="32" width="4" height="4" fill="#ff8844" opacity="0.3"/>
