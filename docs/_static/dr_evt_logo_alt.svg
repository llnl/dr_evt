  <rect x="112" y="32" width="4" height="4" fill="#ff8844" opacity="0.2"/>

  <rect x="12" y="44" width="4" height="4" fill="#dd7744" opacity="0.7"/>
  <rect x="36" y="44" width="4" height="4" fill="#dd7744" opacity="0.6"/>
  <rect x="60" y="44" width="4" height="4" fill="#dd7744" opacity="0.5"/>
  <rect x="84" y="44" width="4" height="4" fill="#dd7744" opacity="0.4"/>
  <rect x="104" y="44" width="4" height="4" fill="#dd7744" opacity="0.3"/>

  <rect x="20" y="56" width="4" height="4" fill="#ff8844" opacity="0.7"/>
  <rect x="44" y="56" width="4" height="4" fill="#ff8844" opacity="0.6"/>
  <rect x="68" y="56" width="4" height="4" fill="#ff8844" opacity="0.5"/>
  <rect x="92" y="56" width="4" height="4" fill="#ff8844" opacity="0.4"/>

  <rect x="8" y="68" width="4" height="4" fill="#dd7744" opacity="0.7"/>
  <rect x="28" y="68" width="4" height="4" fill="#dd7744" opacity="0.6"/>
  <rect x="48" y="68" width="4" height="4" fill="#dd7744" opacity="0.5"/>
  <rect x="68" y="68" width="4" height="4" fill="#dd7744" opacity="0.4"/>
