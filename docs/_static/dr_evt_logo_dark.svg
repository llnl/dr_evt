<?xml version="1.0" encoding="UTF-8"?>
<svg width="196" height="128" viewBox="0 0 196 128" xmlns="http://www.w3.org/2000/svg">
  <!-- DR_EVT Logo Dark - Streams flow around circular clock -->

  <defs>
    <radialGradient id="clockGradientDark" cx="35%" cy="35%" r="70%">
      <stop offset="0%" style="stop-color:#2a3844;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a252f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1419;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glassHighlightDark" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="handGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cccc;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadowDark">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="196" height="128" fill="#000000"/>

  <!-- Direction lines - vary length to wrap around clock -->
  <line x1="0" y1="10" x2="132" y2="10" stroke="#00ffff" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="22" x2="130" y2="22" stroke="#00cccc" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="34" x2="128" y2="34" stroke="#00ffff" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="46" x2="116" y2="46" stroke="#00cccc" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="58" x2="114" y2="58" stroke="#00ffff" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="70" x2="114" y2="70" stroke="#00cccc" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="82" x2="116" y2="82" stroke="#00ffff" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="94" x2="128" y2="94" stroke="#00cccc" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="106" x2="130" y2="106" stroke="#00ffff" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="118" x2="132" y2="118" stroke="#00cccc" stroke-width="1" opacity="0.2"/>

  <!-- Arrows -->
  <polygon points="128,8 132,10 128,12" fill="#00ffff" opacity="0.4"/>
  <polygon points="126,20 130,22 126,24" fill="#00cccc" opacity="0.35"/>
  <polygon points="124,32 128,34 124,36" fill="#00ffff" opacity="0.4"/>
  <polygon points="112,44 116,46 112,48" fill="#00cccc" opacity="0.35"/>
  <polygon points="110,56 114,58 110,60" fill="#00ffff" opacity="0.35"/>
  <polygon points="110,68 114,70 110,72" fill="#00cccc" opacity="0.35"/>
  <polygon points="112,80 116,82 112,84" fill="#00ffff" opacity="0.4"/>
  <polygon points="124,92 128,94 124,96" fill="#00cccc" opacity="0.35"/>
  <polygon points="126,104 130,106 126,108" fill="#00ffff" opacity="0.35"/>
  <polygon points="128,116 132,118 128,120" fill="#00cccc" opacity="0.35"/>

  <!-- Event Streams - TOP (longer) -->
  <rect x="0" y="8" width="4" height="4" fill="#00ffff" opacity="0.9"/>
  <rect x="16" y="8" width="4" height="4" fill="#00ffff" opacity="0.8"/>
  <rect x="32" y="8" width="4" height="4" fill="#00ffff" opacity="0.7"/>
  <rect x="48" y="8" width="4" height="4" fill="#00ffff" opacity="0.6"/>
  <rect x="64" y="8" width="4" height="4" fill="#00ffff" opacity="0.5"/>
  <rect x="80" y="8" width="4" height="4" fill="#00ffff" opacity="0.4"/>
  <rect x="96" y="8" width="4" height="4" fill="#00ffff" opacity="0.3"/>
  <rect x="112" y="8" width="4" height="4" fill="#00ffff" opacity="0.2"/>
  <rect x="124" y="8" width="4" height="4" fill="#00ffff" opacity="0.15"/>

  <rect x="8" y="20" width="4" height="4" fill="#00cccc" opacity="0.8"/>
  <rect x="24" y="20" width="4" height="4" fill="#00cccc" opacity="0.7"/>
  <rect x="40" y="20" width="4" height="4" fill="#00cccc" opacity="0.6"/>
  <rect x="56" y="20" width="4" height="4" fill="#00cccc" opacity="0.5"/>
  <rect x="72" y="20" width="4" height="4" fill="#00cccc" opacity="0.4"/>
  <rect x="88" y="20" width="4" height="4" fill="#00cccc" opacity="0.3"/>
  <rect x="104" y="20" width="4" height="4" fill="#00cccc" opacity="0.2"/>
  <rect x="120" y="20" width="4" height="4" fill="#00cccc" opacity="0.15"/>

  <rect x="4" y="32" width="4" height="4" fill="#00ffff" opacity="1.0"/>
  <rect x="16" y="32" width="4" height="4" fill="#00ffff" opacity="0.9"/>
  <rect x="28" y="32" width="4" height="4" fill="#00ffff" opacity="0.8"/>
  <rect x="40" y="32" width="4" height="4" fill="#00ffff" opacity="0.7"/>
  <rect x="52" y="32" width="4" height="4" fill="#00ffff" opacity="0.6"/>
  <rect x="64" y="32" width="4" height="4" fill="#00ffff" opacity="0.5"/>
  <rect x="76" y="32" width="4" height="4" fill="#00ffff" opacity="0.4"/>
  <rect x="88" y="32" width="4" height="4" fill="#00ffff" opacity="0.3"/>
  <rect x="100" y="32" width="4" height="4" fill="#00ffff" opacity="0.2"/>
  <rect x="112" y="32" width="4" height="4" fill="#00ffff" opacity="0.15"/>

  <!-- MIDDLE (shorter) -->
  <rect x="12" y="44" width="4" height="4" fill="#00cccc" opacity="0.7"/>
  <rect x="36" y="44" width="4" height="4" fill="#00cccc" opacity="0.6"/>
  <rect x="60" y="44" width="4" height="4" fill="#00cccc" opacity="0.5"/>
  <rect x="84" y="44" width="4" height="4" fill="#00cccc" opacity="0.3"/>
  <rect x="104" y="44" width="4" height="4" fill="#00cccc" opacity="0.2"/>

  <rect x="20" y="56" width="4" height="4" fill="#00ffff" opacity="0.7"/>
  <rect x="44" y="56" width="4" height="4" fill="#00ffff" opacity="0.6"/>
  <rect x="68" y="56" width="4" height="4" fill="#00ffff" opacity="0.4"/>
  <rect x="92" y="56" width="4" height="4" fill="#00ffff" opacity="0.3"/>

  <rect x="8" y="68" width="4" height="4" fill="#00cccc" opacity="0.7"/>
  <rect x="28" y="68" width="4" height="4" fill="#00cccc" opacity="0.6"/>
  <rect x="48" y="68" width="4" height="4" fill="#00cccc" opacity="0.5"/>
  <rect x="68" y="68" width="4" height="4" fill="#00cccc" opacity="0.4"/>
  <rect x="88" y="68" width="4" height="4" fill="#00cccc" opacity="0.2"/>

  <rect x="0" y="80" width="4" height="4" fill="#00ffff" opacity="0.9"/>
  <rect x="16" y="80" width="4" height="4" fill="#00ffff" opacity="0.7"/>
  <rect x="32" y="80" width="4" height="4" fill="#00ffff" opacity="0.6"/>
  <rect x="48" y="80" width="4" height="4" fill="#00ffff" opacity="0.5"/>
  <rect x="64" y="80" width="4" height="4" fill="#00ffff" opacity="0.4"/>
  <rect x="80" y="80" width="4" height="4" fill="#00ffff" opacity="0.3"/>
  <rect x="96" y="80" width="4" height="4" fill="#00ffff" opacity="0.2"/>

  <!-- BOTTOM (longer) -->
  <rect x="4" y="92" width="4" height="4" fill="#00cccc" opacity="0.9"/>
  <rect x="16" y="92" width="4" height="4" fill="#00cccc" opacity="0.8"/>
  <rect x="28" y="92" width="4" height="4" fill="#00cccc" opacity="0.7"/>
  <rect x="40" y="92" width="4" height="4" fill="#00cccc" opacity="0.6"/>
  <rect x="52" y="92" width="4" height="4" fill="#00cccc" opacity="0.5"/>
  <rect x="64" y="92" width="4" height="4" fill="#00cccc" opacity="0.4"/>
  <rect x="76" y="92" width="4" height="4" fill="#00cccc" opacity="0.35"/>
  <rect x="88" y="92" width="4" height="4" fill="#00cccc" opacity="0.3"/>
  <rect x="100" y="92" width="4" height="4" fill="#00cccc" opacity="0.2"/>
  <rect x="112" y="92" width="4" height="4" fill="#00cccc" opacity="0.15"/>

  <rect x="12" y="104" width="4" height="4" fill="#00ffff" opacity="0.7"/>
  <rect x="32" y="104" width="4" height="4" fill="#00ffff" opacity="0.6"/>
  <rect x="52" y="104" width="4" height="4" fill="#00ffff" opacity="0.5"/>
  <rect x="72" y="104" width="4" height="4" fill="#00ffff" opacity="0.4"/>
  <rect x="92" y="104" width="4" height="4" fill="#00ffff" opacity="0.3"/>
  <rect x="112" y="104" width="4" height="4" fill="#00ffff" opacity="0.2"/>

  <rect x="8" y="116" width="4" height="4" fill="#00cccc" opacity="0.6"/>
  <rect x="28" y="116" width="4" height="4" fill="#00cccc" opacity="0.5"/>
  <rect x="48" y="116" width="4" height="4" fill="#00cccc" opacity="0.4"/>
  <rect x="68" y="116" width="4" height="4" fill="#00cccc" opacity="0.35"/>
  <rect x="88" y="116" width="4" height="4" fill="#00cccc" opacity="0.3"/>
  <rect x="108" y="116" width="4" height="4" fill="#00cccc" opacity="0.2"/>
  <rect x="124" y="116" width="4" height="4" fill="#00cccc" opacity="0.15"/>

  <!-- Clock centered at x=128 -->
  <g transform="translate(128, 0)" filter="url(#dropShadowDark)">
    <!-- Clock face - smooth circular -->
    <ellipse cx="0" cy="64" rx="56" ry="56" fill="url(#clockGradientDark)" opacity="0.95"/>

    <!-- Glass highlight overlay for water drop effect - subtle -->
    <ellipse cx="-10" cy="45" rx="28" ry="25" fill="url(#glassHighlightDark)"/>

    <!-- Neon rim highlight (top-left edge) - very subtle -->
    <ellipse cx="-8" cy="48" rx="24" ry="20" fill="#00ffff" opacity="0.06"/>

    <!-- Hour markers - squares at 12, 3, 6, 9 (radius ~50px from center) -->
    <rect x="-3" y="11" width="6" height="6" fill="#00ffff" filter="url(#neonGlow)"/>
    <rect x="47" y="61" width="6" height="6" fill="#00ffff" filter="url(#neonGlow)"/>
    <rect x="-3" y="111" width="6" height="6" fill="#00ffff" filter="url(#neonGlow)"/>
    <rect x="-53" y="61" width="6" height="6" fill="#00ffff" filter="url(#neonGlow)"/>

    <!-- Subtle dots at radius ~50px -->
    <rect x="24" y="20" width="3" height="3" fill="#00ffff" opacity="0.5"/>   <!-- 1 o'clock -->
    <rect x="42" y="38" width="3" height="3" fill="#00ffff" opacity="0.5"/>   <!-- 2 o'clock -->
    <rect x="24" y="106" width="3" height="3" fill="#00ffff" opacity="0.5"/>  <!-- 4 o'clock -->
    <rect x="42" y="88" width="3" height="3" fill="#00ffff" opacity="0.5"/>   <!-- 5 o'clock -->
    <rect x="-44" y="88" width="3" height="3" fill="#00ffff" opacity="0.5"/>  <!-- 7 o'clock -->
    <rect x="-26" y="106" width="3" height="3" fill="#00ffff" opacity="0.5"/> <!-- 8 o'clock -->
    <rect x="-26" y="20" width="3" height="3" fill="#00ffff" opacity="0.5"/>  <!-- 10 o'clock -->
    <rect x="-44" y="38" width="3" height="3" fill="#00ffff" opacity="0.5"/>  <!-- 11 o'clock -->

    <!-- Hour hand - very pixelated with 6x6 blocks -->
    <rect x="-3" y="58" width="6" height="6" fill="url(#handGradientDark)"/>
    <rect x="-9" y="52" width="6" height="6" fill="url(#handGradientDark)"/>
    <rect x="-15" y="46" width="6" height="6" fill="url(#handGradientDark)"/>
    <rect x="-21" y="40" width="6" height="6" fill="url(#handGradientDark)"/>

    <!-- Minute hand - very pixelated with 6x6 blocks -->
    <rect x="3" y="58" width="6" height="6" fill="url(#handGradientDark)"/>
    <rect x="9" y="52" width="6" height="6" fill="url(#handGradientDark)"/>
    <rect x="15" y="46" width="6" height="6" fill="url(#handGradientDark)"/>
    <rect x="21" y="40" width="6" height="6" fill="url(#handGradientDark)"/>
    <rect x="27" y="34" width="6" height="6" fill="url(#handGradientDark)"/>
    <rect x="33" y="28" width="6" height="6" fill="url(#handGradientDark)"/>

    <!-- Center pivot -->
    <ellipse cx="0" cy="64" rx="7" ry="7" fill="#34495e"/>
    <ellipse cx="0" cy="64" rx="5" ry="5" fill="#00ffff" opacity="0.9"/>
    <ellipse cx="-1" cy="63" rx="2" ry="2" fill="#ffffff"/>
  </g>
</svg>
