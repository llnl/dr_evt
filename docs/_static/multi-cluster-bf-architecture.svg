<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 1.5; rx: 6; }
    .core { fill: #f4f4f4; stroke: #333; stroke-width: 1.5; rx: 6; }
    .exp { fill: #eaf2fb; stroke: #1f5fa8; stroke-width: 1.5; rx: 6; }
    .hook { fill: #fff4d6; stroke: #b7791f; stroke-width: 1.5; rx: 6; }
    .title { font-size: 15px; font-weight: bold; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; }
    .small { font-size: 11.5px; fill: #444; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-blue { stroke: #1f5fa8; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
    .label { font-size: 11.5px; }
  </style>

  <!-- Column headers -->
  <text x="170" y="24" text-anchor="middle" class="title">driver (experimental)</text>
  <text x="520" y="24" text-anchor="middle" class="title">core, src/sim (one hook added)</text>
  <text x="890" y="24" text-anchor="middle" class="title">scheduler (experimental)</text>

  <!-- Driver box: x 20..320 -->
  <rect x="20" y="40" width="300" height="300" class="exp"/>
  <text x="170" y="62" text-anchor="middle" class="title">multi_system_backfill_sim</text>
  <text x="34" y="88">1. Parse its own options:</text>
  <text x="48" y="106" class="mono">--systems / --systems_file</text>
  <text x="48" y="122" class="mono">--spatial_backfill</text>
  <text x="48" y="138" class="mono">--placement_policy</text>
  <text x="34" y="162">2. Forward the rest to Sim_Params,</text>
  <text x="48" y="178">set total_nodes = sum of capacities,</text>
  <text x="48" y="194">refuse unsupported settings</text>
  <text x="34" y="218">3. Build the scheduler, inject it</text>
  <text x="34" y="242">4. sim.run(); the core writes the</text>
  <text x="48" y="258">job CSV and resource trace (totals)</text>
  <text x="34" y="282">5. Read placements(), write the</text>
  <text x="48" y="298">job_id,system sidecar, print the</text>
  <text x="48" y="314">per-system summary</text>

  <!-- Core box: x 370..670 -->
  <rect x="370" y="40" width="300" height="420" class="core"/>
  <text x="520" y="62" text-anchor="middle" class="title">BasicSimulation</text>
  <text x="520" y="84" text-anchor="middle" class="small">one shared pool of sum_k C_k nodes</text>

  <rect x="384" y="98" width="272" height="80" class="hook"/>
  <text x="520" y="116" text-anchor="middle" class="mono">submit_job(job)</text>
  <text x="394" y="134" class="small">reject if nodes &gt; total_nodes</text>
  <text x="394" y="148" class="small">or !scheduler-&gt;can_ever_run(nodes)</text>
  <text x="394" y="166" class="small">(the one hook added to the core)</text>

  <rect x="384" y="192" width="272" height="150" class="box"/>
  <text x="520" y="210" text-anchor="middle" class="title">event loop (advance_to)</text>
  <text x="394" y="230" class="small">process every END at time t</text>
  <text x="394" y="246" class="small">record arrivals at time t</text>
  <text x="394" y="266">then repeat until empty:</text>
  <text x="404" y="284" class="mono">ids = schedule(free_nodes,</text>
  <text x="450" y="300" class="mono">running_jobs, t)</text>
  <text x="404" y="318" class="small">for each id: START event, counter,</text>
  <text x="404" y="332" class="small">running_jobs[id] = {t, limit, nodes}</text>

  <rect x="384" y="356" width="272" height="90" class="box"/>
  <text x="520" y="374" text-anchor="middle" class="title">what the scheduler is shown</text>
  <text x="394" y="394" class="mono">free_nodes</text>
  <text x="476" y="394" class="small">total minus nodes in use</text>
  <text x="394" y="412" class="mono">running_jobs</text>
  <text x="490" y="412" class="small">job: {start, limit, nodes}</text>
  <text x="394" y="430" class="small">both without any system identity</text>

  <!-- Scheduler box: x 740..1040 -->
  <rect x="740" y="40" width="300" height="420" class="exp"/>
  <text x="890" y="62" text-anchor="middle" class="title">MultiSystemBackfillScheduler</text>
  <text x="754" y="82" class="small">derives from FCFSEasyCustomScheduler only</text>
  <text x="754" y="96" class="small">to use the injection constructor</text>

  <rect x="754" y="108" width="272" height="56" class="box"/>
  <text x="890" y="126" text-anchor="middle" class="title">FCFS deque</text>
  <text x="764" y="144" class="small">submit-ordered, eligible prefix,</text>
  <text x="764" y="156" class="small">lazy removal (as the core schedulers)</text>

  <rect x="754" y="174" width="272" height="56" class="box"/>
  <text x="890" y="192" text-anchor="middle" class="title">placements</text>
  <text x="764" y="210" class="mono">job -&gt; {system, demand}</text>
  <text x="764" y="224" class="small">for every job this scheduler started</text>

  <rect x="754" y="240" width="272" height="120" class="box"/>
  <text x="890" y="258" text-anchor="middle" class="title">CountResourceModel (seam)</text>
  <text x="764" y="276" class="small">per system: capacity, used</text>
  <text x="764" y="292" class="mono">admissible  demand  fits_now</text>
  <text x="764" y="308" class="mono">leftover    earliest_fit</text>
  <text x="764" y="326" class="small">the only code that knows resources</text>
  <text x="764" y="340" class="small">are integers; a vector model replaces</text>
  <text x="764" y="352" class="small">it for heterogeneous systems</text>

  <rect x="754" y="370" width="272" height="78" class="box"/>
  <text x="890" y="388" text-anchor="middle" class="title">policy</text>
  <text x="764" y="406" class="small">spatial backfill: target_only /</text>
  <text x="764" y="420" class="small">every_system / global_shadow</text>
  <text x="764" y="436" class="small">placement: best / first / worst fit</text>

  <!-- Arrows driver -> core -->
  <path d="M320,222 L370,222" class="arrow-blue"/>
  <text x="345" y="212" text-anchor="middle" class="label">inject</text>

  <!-- Arrows core <-> scheduler -->
  <path d="M656,132 L740,132" class="arrow"/>
  <text x="698" y="122" text-anchor="middle" class="label">can_ever_run</text>
  <path d="M656,292 L740,292" class="arrow"/>
  <text x="698" y="282" text-anchor="middle" class="label">schedule(...)</text>
  <path d="M740,316 L656,316" class="arrow"/>
  <text x="698" y="332" text-anchor="middle" class="label">start ids</text>

  <!-- Arrow scheduler -> driver (placements), routed below -->
  <path d="M890,460 L890,500 L170,500 L170,340" class="arrow-blue"/>
  <text x="530" y="494" text-anchor="middle" class="label">placements() read after the run</text>

  <!-- Outputs -->
  <rect x="20" y="516" width="460" height="34" class="box"/>
  <text x="250" y="538" text-anchor="middle" class="small">driver outputs: &lt;outfile&gt;_placements.csv, per-system summary (stdout)</text>
  <rect x="500" y="516" width="540" height="34" class="box"/>
  <text x="770" y="538" text-anchor="middle" class="small">core outputs (unchanged format): job CSV, resource trace with totals over all systems</text>
</svg>
