<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="540" viewBox="0 0 1220 540" role="img" aria-labelledby="title desc">
  <title id="title">FCFS with EASY backfilling: mean end-to-end runtime relative to deque</title>
  <desc id="desc">November 12, 2026 EASY end-to-end runtimes: circular uses 0.93 times deque’s time; multimap and Python use 12.27 and 35.13 times, respectively.</desc>
  <style>.title{font:600 20px sans-serif;fill:#243746}.subtitle{font:13px sans-serif;fill:#52636f}.label{font:14px sans-serif;fill:#243746}.value{font:13px sans-serif;fill:#243746}.tick{font:12px sans-serif;fill:#52636f}.grid{stroke:#d9e2e8;stroke-width:1}.baseline{stroke:#52636f;stroke-width:2}</style>
  <rect width="1220" height="540" fill="#fff"/>
  <text x="38" y="35" class="title">FCFS/EASY end-to-end runtime relative to deque</text>
  <text x="38" y="57" class="subtitle">November 12, 2026; mean of 10 runs; bar length is log₂(runtime / deque). Exact times and standard deviations are in the table.</text>
  <g class="grid"><line x1="365" y1="95" x2="365" y2="475"/><line x1="595" y1="95" x2="595" y2="475"/><line x1="710" y1="95" x2="710" y2="475"/><line x1="825" y1="95" x2="825" y2="475"/><line x1="940" y1="95" x2="940" y2="475"/><line x1="1055" y1="95" x2="1055" y2="475"/><line x1="1170" y1="95" x2="1170" y2="475"/></g><line x1="480" y1="85" x2="480" y2="475" class="baseline"/>
  <g class="tick"><text x="365" y="84" text-anchor="middle">0.5×</text><text x="480" y="75" text-anchor="middle">1× deque</text><text x="595" y="84" text-anchor="middle">2×</text><text x="710" y="84" text-anchor="middle">4×</text><text x="825" y="84" text-anchor="middle">8×</text><text x="940" y="84" text-anchor="middle">16×</text><text x="1055" y="84" text-anchor="middle">32×</text><text x="1170" y="84" text-anchor="middle">64×</text></g>
  <g><text x="38" y="119" class="label">Circular</text><rect x="468.2" y="104" width="11.8" height="20" rx="3" fill="#8fd3a1"/><text x="458.2" y="119" text-anchor="end" class="value">0.93×</text>
  <text x="38" y="154" class="label">Block-4</text><rect x="480.0" y="139" width="223.8" height="20" rx="3" fill="#9ec5e5"/><text x="713.8" y="154" class="value">3.85×</text>
  <text x="38" y="189" class="label">Block-8</text><rect x="480.0" y="174" width="229.5" height="20" rx="3" fill="#9ec5e5"/><text x="719.5" y="189" class="value">3.99×</text>
  <text x="38" y="224" class="label">Block-16</text><rect x="480.0" y="209" width="240.1" height="20" rx="3" fill="#9ec5e5"/><text x="730.1" y="224" class="value">4.25×</text>
  <text x="38" y="259" class="label">Block-32</text><rect x="480.0" y="244" width="266.3" height="20" rx="3" fill="#9ec5e5"/><text x="756.3" y="259" class="value">4.98×</text>
  <text x="38" y="294" class="label">Block-64</text><rect x="480.0" y="279" width="330.2" height="20" rx="3" fill="#9ec5e5"/><text x="820.2" y="294" class="value">7.32×</text>
  <text x="38" y="329" class="label">Block-128</text><rect x="480.0" y="314" width="414.4" height="20" rx="3" fill="#9ec5e5"/><text x="904.4" y="329" class="value">12.16×</text>
  <text x="38" y="364" class="label">Block-256</text><rect x="480.0" y="349" width="502.3" height="20" rx="3" fill="#9ec5e5"/><text x="992.3" y="364" class="value">20.65×</text>
  <text x="38" y="399" class="label">Deque</text><circle cx="480" cy="394" r="7" fill="#607d8b"/><text x="492" y="399" class="value">1.00×</text>
  <text x="38" y="434" class="label">Multimap</text><rect x="480.0" y="419" width="416.0" height="20" rx="3" fill="#e8aa85"/><text x="906.0" y="434" class="value">12.27×</text>
  <text x="38" y="469" class="label">Python reference</text><rect x="480.0" y="454" width="590.5" height="20" rx="3" fill="#e7a7c5"/><text x="1080.5" y="469" class="value">35.13×</text></g>
  <text x="38" y="512" class="subtitle">Lower is better. Circular is left of the deque baseline; every block size is right of it.</text>
</svg>
