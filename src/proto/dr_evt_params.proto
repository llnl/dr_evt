syntax = "proto3";

package dr_evt_proto;

message DR_EVT_Params {
    // Scheduler selection (the same rules as the CLI):
    // - Ordinary event-driven FCFS/EASY: priority_policy: "fcfs",
    //   backfill_policy: "easy", queue_impl: "circular"; both intervals zero.
    // - Event-driven hybrid: backfill_policy: "hybrid", reservation_depth: R
    //   with R > 0. Use FCFS ordering.
    // - Per-scan accounting: per_pass_accounting: true, FCFS ordering,
    //   queue_impl: "circular", both intervals zero, planning_horizon omitted.
    //   A pass is one attempt to scan the waiting queue at the current time.
    //   Starts and successful reservations count toward Q; after R reservations,
    //   failed start-only tests also count. Q/R reset on each attempt; simulation
    //   time does not advance between attempts. Q is backfill_queue_depth.
    // - OpenPBS forecast: priority_policy: "fcfs_1s_evt_group", queue_impl: "circular",
    //   both intervals zero, planning_horizon omitted. per_pass_accounting is
    //   not required. Group predicted events through T+1 after the earliest event
    //   T, inclusive, then check fit at the last actual event in the group.
    //   A lone release at T is checked at T, without an automatic extra delay.
    // - Separate periodic backfill: backfill_interval: I > 0, FCFS ordering,
    //   queue_impl: "circular", dispatch_interval: 0. Queue-head starts remain
    //   event driven; backfill uses timer ticks.
    // - Fixed periodic dispatch: dispatch_interval: I > 0, FCFS ordering,
    //   queue_impl: "circular", backfill_interval: 0, backfill_queue_depth: 0.
    //   dispatch_queue_depth bounds all examined jobs, including immediate starts.
    //   dispatch_on_events additionally wakes on arrival batches.
    // - Diagnostic unprotected backfill: diagnostic_no_reservations: true with
    //   separate periodic hybrid/conservative backfill; no future reservations.
    // Per-scan accounting cannot be combined with either periodic interval.
    // Hybrid requires positive reservation_depth. Conservative protects every
    // examined waiting job; EASY protects one. Queue-depth zero is unlimited.
    // CLI names are field names prefixed with --; boolean switches map to true.
    // Scheduling uses interchangeable capacity counts, not a node resource graph.
    message Simulation_Params {
        // Random-number seed (default: deterministic zero).
        uint32 seed = 1;

        // The maximum number of jobs to run.
        uint32 max_jobs = 2;
        // The upper limit of simulation time to run.
        double max_time = 3;

        string infile = 4;
        // Path to a file listing multiple trace files, one per line -
        // progressive loading (see docs/dev/OUTPUT_TRACE_BUFFERS.md): each is
        // loaded in turn as the
        // simulation reaches it, so job_store_capacity can actually
        // bound memory. Mutually exclusive with infile - do not set
        // both. Files must already be sorted by submit_time, both
        // within each file and across the sequence.
        string infile_list = 5;
        string outfile = 6;
        string resource_trace = 7;      // Optional resource usage trace output file

        // Enable verbose output for debugging and testing
        // (default: false for production runs)
        bool verbose = 8;

        // Preserve millisecond precision in job and resource output timestamps.
        // CLI: --msec_output (default: false).
        bool msec_output = 9;

        // Scheduling parameters
        // CLI: --total_nodes.
        uint32 total_nodes = 10;         // System node count (default: 795)
        // CLI: --backfill_policy.
        string backfill_policy = 11;     // "easy", "conservative", "hybrid", or "none" (default: "easy")
        // CLI: --priority_policy.
        string priority_policy = 12;    // "fcfs", "fcfs_alt", "fcfs_conservative", "fcfs_1s_evt_group", "sjf", or "ljf" (default: "fcfs")

        // Trace format parameters
        string trace_type = 13;         // "standard", "pcon", or "swf" (default: "standard")
        string trace_format = 14;       // "simple", "lassen", or "swf" (default: "simple")
        string timestamp_format = 15;   // retained "epoch"/"iso" compatibility value (default: "epoch")
        string timezone = 16;           // e.g., "UTC", "America/Los_Angeles" (default: "America/Los_Angeles")

        // Run time determination parameters
        // Scheduler uses time_limit as the best estimator for planning
        string run_time_mode = 17;      // "actual", "distribution", or "limit" (default: "actual")
        string run_time_distribution = 18; // "normal", "lognormal", or "uniform" (default: "normal")
        double run_time_scale = 19;     // Scale factor (default: 1.0)
        double run_time_stddev = 20;    // Standard deviation factor (default: 0.0)

        // Queue implementation (FCFS scheduler only)
        // CLI: --queue_impl.
        string queue_impl = 21;         // "circular", "deque", "multimap", or "block" (default: "circular")

        // Block size for block queue implementation (must be power of 2)
        // CLI: --block_size.
        uint32 block_size = 22;         // 4, 8, 16, 32, 64, 128, or 256 (default: 128)

        // Initial capacity for circular queue implementation. 0 means
        // the size of the job trace (large enough it can never overflow).
        // CLI: --wait_queue_capacity.
        uint64 wait_queue_capacity = 23;  // (default: 0)

        // What to do if a circular queue insert would exceed wait_queue_capacity
        // CLI: --wait_queue_overflow.
        string wait_queue_overflow = 24;  // "abort" or "grow" (default: "grow")

        // Initial capacity for the job-record store (Trace::m_data, a
        // boost::circular_buffer). 0 means the size of the job trace
        // (large enough it can never overflow).
        uint64 job_store_capacity = 25; // (default: 0)

        // What to do if a job-store insert would exceed job_store_capacity
        string job_store_overflow = 26; // "abort" or "grow" (default: "grow")
        // Before growing the job-record store for a new batch, refuse
        // if doing so would push projected peak usage past this
        // fraction of actual available system memory (Linux only; a
        // no-op elsewhere). Must be > 0.0 and <= 1.0 (e.g. 0.8 for
        // 80%); 0.0 (the default) disables the check entirely.
        // Independent of job_store_overflow.
        double memory_pressure_fraction = 27;

        // Initial capacity for the resource-history circular buffer. 0
        // auto-sizes to twice the number of loaded jobs, with a minimum
        // capacity of 4096 entries. No overflow-policy field: unlike
        // job_store, every entry here is always immediately safe to reclaim,
        // so reclaiming when full never needs an abort/grow fallback.
        uint64 resource_history_capacity = 28; // (default: 0)

        // Number of processed job departures between opportunistic writes and
        // reclamation of the completed front prefix. 0 follows the current
        // job-store capacity. Capacity pressure and explicit/final flushes
        // remain independent triggers.
        uint64 job_flush_interval = 29; // (default: 0)

        // Maximum feasible jobs passed to an experimental external backfill
        // selector in one decision. 0 keeps Sim_Params' default (1).
        uint64 num_max_candidates = 30;

        // Optional CSV with time,total_nodes change points. Values may not
        // exceed total_nodes; reductions do not preempt running jobs.
        string capacity_schedule = 31;

        // Global simulation start time. A positive value enables replay-based
        // warm start; replay jobs already running at the boundary seed resources.
        double sim_start_time = 32;

        // "inherit" (default) reconstructs jobs waiting at a replay warm
        // boundary; "drop" preserves the legacy omission behavior.
        string warm_start_wait_queue = 33;

        // When both are nonempty, write simulated-job and resource-history
        // output to Redis instead of outfile/resource_trace. Requires
        // DR_EVT_WITH_REDIS=ON.
        string redis_uri = 34;
        string redis_key_prefix = 35;

        // Automatic checkpoint destination and completed-job cadence.
        // Progressive loading also checkpoints at each input-file boundary.
        string checkpoint_file = 36;
        uint64 checkpoint_interval_jobs = 37;
        // SWF input only: processors per node used to convert allocated
        // processors to nodes. 0 derives it from the file header.
        uint32 cores_per_node = 38;

        // Waiting jobs that hold reservations under backfill_policy
        // "hybrid"; must be positive with hybrid and is ignored otherwise.
        // CLI: --reservation_depth.
        uint64 reservation_depth = 39;

        // Eligible waiting jobs, head included, examined per backfill pass
        // by every scheduler. Zero leaves the scan unlimited.
        // CLI: --backfill_queue_depth.
        uint64 backfill_queue_depth = 40;

        // Seconds between periodic backfill evaluations; FCFS dispatch
        // remains event driven. Zero keeps event-driven backfill behavior.
        // CLI: --backfill_interval.
        double backfill_interval = 41;

        // Fixed periodic dispatch: aligned FCFS/backfill ticks; optional arrival wakes.
        // Zero disables; mutually exclusive with positive backfill_interval.
        // CLI: --dispatch_interval.
        double dispatch_interval = 42;
        // Entire candidate prefix per dispatch wake, including immediate starts.
        // Zero means unlimited; requires dispatch_interval > 0.
        // CLI: --dispatch_queue_depth.
        uint64 dispatch_queue_depth = 43;
        // Also wake fixed periodic dispatch on job arrival batches, keeping the tick phase.
        // CLI: --dispatch_on_events.
        bool dispatch_on_events = 44;
        // Event-driven placement passes with per-pass Q/R and guarded retries.
        // CLI: --per_pass_accounting.
        bool per_pass_accounting = 45;
        // Diagnostic periodic model: no future capacity reservations.
        // CLI: --diagnostic_no_reservations.
        bool diagnostic_no_reservations = 46;

        // Planning time-limit grid for scheduler projections; zero is exact.
        // CLI: --planning_time_resolution.
        double planning_time_resolution = 47;

        // Maximum reservation look-ahead for backfill planning, event-driven
        // or periodic (Slurm bf_window). Presence is explicit so zero is a
        // valid immediate horizon.
        // CLI: --planning_horizon.
        optional double planning_horizon = 48;

        // Seconds a job's nodes stay unavailable after it ends before another
        // job can start on them (default 0: reusable at the job's end). Not
        // applied to replayed history.
        double node_release_delay = 49;
        // "constant" (default), "exponential", or "uniform": per-node cleanup
        // time whose maximum over the job's nodes is the job's delay.
        string node_release_delay_model = 50;
        // Half-width of the uniform per-node cleanup time; ignored otherwise.
        double node_release_delay_spread = 51;
    }

    message Tracing_Params {
        // The maximum number of jobs to trace.
        uint32 max_jobs = 1;
        // The upper limit of time in job history (as a timestamp) to trace.
        string max_time = 2;

        string infile = 3;
        string outfile = 4;
        string outfile_dat = 5;    // Optional detected-DAT-session report
        string outfile_sub = 6;    // Optional hourly submission statistics
        string outfile_subsum = 7; // Optional hour-of-week submission summary
    }

    Simulation_Params sim_setup = 1;
    Tracing_Params trace_setup = 2;
}
