syntax = "proto3";

package dr_evt_proto;

message DR_EVT_Params {
    message Simulation_Params {
        // The seed for random number generator. Without this,
        // it will use a value dependent on the current system clock.
        uint32 seed = 1;

        // The maximum number of jobs to run.
        uint32 max_jobs = 2;
        // The upper limit of simulation time to run.
        double max_time = 3;

        string infile = 4;
        string outfile = 5;
        string resource_trace = 6;      // Optional resource usage trace output file

        // Enable verbose output for debugging and testing
        // (default: false for production runs)
        bool verbose = 7;

        // Scheduling parameters
        uint32 total_nodes = 8;         // System node count (default: 795)
        string backfill_policy = 9;     // "easy", "conservative" or "none" (default: "easy")
        string priority_policy = 10;    // "fcfs", "sjf", or "ljf" (default: "fcfs")
        string duration_mode = 11;       // "limit" or "actual" (default: "limit")

        // Trace format parameters
        string trace_format = 12;       // "simple" or "lassen" (default: "lassen")
        string timestamp_format = 13;   // "epoch" or "iso" (default: "iso")
        string timezone = 14;           // e.g., "UTC", "America/Los_Angeles" (default: "America/Los_Angeles")

        // Duration simulation parameters
        string run_time_mode = 15;      // "column", "exact", or "distribution" (default: "exact")
        string run_time_distribution = 16; // "normal", "lognormal", or "uniform" (default: "normal")
        double run_time_scale = 17;     // Scale factor (default: 1.0)
        double run_time_stddev = 18;    // Standard deviation factor (default: 0.0)

        // Queue implementation (FCFS scheduler only)
        string queue_impl = 19;         // "circular", "deque", "multimap", or "block" (default: "circular")

        // Block size for block queue implementation (must be power of 2)
        uint32 block_size = 20;         // 32, 64, 128, or 256 (default: 128)

        // Initial capacity for circular queue implementation. 0 means
        // the size of the job trace (large enough it can never overflow).
        uint64 circular_capacity = 21;  // (default: 0)

        // What to do if a circular queue insert would exceed circular_capacity
        string circular_overflow = 22;  // "abort" or "grow" (default: "grow")
    }

    message Tracing_Params {
        // The maximum number of jobs to trace.
        uint32 max_jobs = 1;
        // The upper limit of time in job history (as a timestamp) to trace.
        string max_time = 2;

        string infile = 3;
        string outfile = 4;
        string outfile_dat = 5;
        string outfile_sub = 6;
        string outfile_subsum = 7;
    }

    Simulation_Params sim_setup = 1;
    Tracing_Params trace_setup = 2;
}
